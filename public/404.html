<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect trick
      // Encodes the path into the query string and redirects to index.html
      var path = window.location.pathname.slice('/lang-app'.length) || '/';
      window.location.replace(
        '/lang-app/?p=' + encodeURIComponent(path) + window.location.hash
      );
    </script>
  </head>
  <body></body>
</html>
